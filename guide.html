<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
  <meta name="theme-color" content="#050713">
  <title>Hướng dẫn — Tundenxin (Void Realm)</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/jpeg" href="genshin-icon.jpg">
</head>
<body class="guide-page">
  <div class="skirk-bg-fixed" aria-hidden="true"></div>
  <div class="skirk-bg-overlay" aria-hidden="true"></div>
  <div class="gold-dust" aria-hidden="true"></div>
  <header class="nav">
    <a class="brand" href="index.html" aria-label="Tundenxin Trang chủ">
      <span class="primogem" aria-hidden="true"><span></span></span>
      <span><strong>Tundenxin</strong><small>Genshin Mobile Free</small></span>
    </a>

    <nav class="main-nav">
      <a href="index.html">⌂ <span>Trang chủ</span></a>
      <a href="index.html#tools">⚒ <span>Tool Genshin</span></a>
      <a class="active" href="guide.html">▣ <span>Hướng dẫn</span></a>
    </nav>

    <div class="socials">
      <a class="social telegram" href="https://t.me/BoxToolGS_VN" target="_blank" rel="noopener">➤ Telegram ↗</a>
      <a class="social discord" href="https://discord.gg/Nfu5hqb3q" target="_blank" rel="noopener">◉ Discord ↗</a>
    </div>
  </header>

  <main class="guide-wrap">
    <div class="guide-title">
      <span class="eyebrow">✦ TUNDENXIN GUIDE • VOID REALM ✦</span>
      <h1>Hướng dẫn sử dụng</h1>
      <p>Chọn Tool Genshin bạn muốn xem hướng dẫn. Video chỉ xuất hiện sau khi bạn chọn.</p>
    </div>

    <div class="guide-grid">
      <button class="guide-card" data-title="Kuro — Hướng dẫn tính năng" data-video="https://www.youtube.com/embed/UC3BvsKfpBY">
        <img src="genshin-icon.jpg" alt="Genshin Impact Kuro" class="tool-app-icon">
        <span>
          <small>GENSHIN IMPACT</small>
          <strong>Kuro</strong>
          <em>Hướng dẫn tính năng</em>
        </span>
        <b>▶</b>
      </button>

      <button class="guide-card" data-title="DMSHBY — Hướng dẫn cài đặt" data-video="https://www.youtube.com/embed/D0v4Izh_cfY">
        <img src="genshin-icon.jpg" alt="Genshin Impact DMSHBY" class="tool-app-icon">
        <span>
          <small>GENSHIN IMPACT</small>
          <strong>DMSHBY</strong>
          <em>Hướng dẫn cài đặt</em>
        </span>
        <b>▶</b>
      </button>

      <button class="guide-card" data-title="Yukino — Hướng dẫn cài đặt" data-video="https://www.youtube.com/embed/Q_vPnxsaLcE">
        <img src="genshin-icon.jpg" alt="Genshin Impact Yukino" class="tool-app-icon">
        <span>
          <small>GENSHIN IMPACT</small>
          <strong>Yukino</strong>
          <em>Hướng dẫn cài đặt</em>
        </span>
        <b>▶</b>
      </button>

      <button class="guide-card locked" disabled>
        <img src="genshin-icon.jpg" alt="Genshin Impact Eleutheria" class="tool-app-icon">
        <span>
          <small>GENSHIN IMPACT</small>
          <strong>Eleutheria</strong>
          <em>Sắp có hướng dẫn</em>
        </span>
        <b>◷</b>
      </button>
    </div>

    <section class="video-panel" id="videoPanel" hidden>
      <div class="video-head">
        <div>
          <span class="kicker">✦ VIDEO HƯỚNG DẪN</span>
          <h2 id="videoTitle"></h2>
        </div>
        <button id="closeVideo" aria-label="Đóng">×</button>
      </div>
      <div class="video-frame">
        <iframe id="videoFrame" title="Video hướng dẫn" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
      </div>
    </section>
  </main>

  <footer>
    <span class="primogem small"><span></span></span>
    <b>Tundenxin</b>
    <span>•</span>
    <span>Hướng dẫn</span>
  </footer>

  <script>
    const panel = document.getElementById('videoPanel');
    const frame = document.getElementById('videoFrame');
    const title = document.getElementById('videoTitle');

    document.querySelectorAll('.guide-card:not(.locked)').forEach(card => {
      card.addEventListener('click', () => {
        title.textContent = card.dataset.title;
        frame.src = card.dataset.video + '?autoplay=1';
        panel.hidden = false;
        panel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      });
    });

    document.getElementById('closeVideo').addEventListener('click', () => {
      frame.src = '';
      panel.hidden = true;
    });
  </script>
</body>
</html>
